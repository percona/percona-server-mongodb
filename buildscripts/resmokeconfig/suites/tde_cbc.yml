# Section that is ignored by resmoke.py.
config_variables:
  - &keyFile jstests/percona/tde/ekf
  - &cipherMode AES256-CBC

test_kind: js_test

selector:
  roots:
    - jstests/percona/tde/*.js

# these tests start their own instances
executor:
  config:
    shell_options:
      global_vars:
        TestData:
          encryptionKeyFile: *keyFile
          cipherMode: *cipherMode
      nodb: ""
