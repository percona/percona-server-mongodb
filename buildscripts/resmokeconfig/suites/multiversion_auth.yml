# Section that is ignored by resmoke.py.
config_variables:
  - &keyFile jstests/libs/authTestsKey
  - &keyFileData Thiskeyisonlyforrunningthesuitewithauthenticationdontuseitinanytestsdirectly

test_kind: js_test

selector:
  roots:
    - jstests/multiVersion/**/*.js
  exclude_files:
    # Do not execute files with helper functions.
    - jstests/multiVersion/libs/*.js

    # TODO: SERVER-28104
    - jstests/multiVersion/genericBinVersion/minor_version_tags_new_old_new.js

    # TODO SERVER-42919: recent work on the ReplicaSetMonitor means that mongoS no longer crashes when
    # it attempts to connect to an upgraded mongoD. Un-denylist when SERVER-42919 fixes this issue.
    - jstests/multiVersion/genericSetFCVUsage/fcv_core/crash_mongos_against_upgraded_cluster.js

    # SERVER-80249 is the 7.0-to-8.0 mixed cluster-role upgrade. On this 9.0 branch last-lts is
    # 8.0 and an omitted binVersion is latest (9.0). That pair never elects a writable primary
    # after the shardsvr restart, so getPrimary times out. Pinning 7.0 and 8.0 does not exercise
    # the 9.0 binary under test.
    - jstests/multiVersion/genericBinVersion/mixed_cluster_roles.js

    # Skip any tests that run with auth explicitly.
    - jstests/multiVersion/genericBinVersion/load_keys_on_upgrade.js
    - jstests/multiVersion/genericBinVersion/server-security/dollar_audit_mixed_version_mongods.js

  exclude_with_any_tags:
    - featureFlagToaster
    - featureFlagSpoon
    - auth_incompatible

# Multiversion tests start their own mongod's.
executor:
  config:
    shell_options:
      global_vars:
        TestData:
          setParameters:
            bsonTestValidationVersion: 1
            logComponentVerbosity:
              accessControl: 2
              command: 2
          auth: true
          #          authMechanism: SCRAM-SHA-256
          keyFile: *keyFile
          keyFileData: *keyFileData
          # TODO (SERVER-111403): Enable OpenTelemetry tracing in multiversion suites.
          enableOTELTracing: false
      authenticationDatabase: local
      #      authenticationMechanism: SCRAM-SHA-256
      password: *keyFileData
      username: __system
      nodb: ""
