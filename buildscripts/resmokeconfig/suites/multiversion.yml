test_kind: js_test

selector:
  roots:
    - jstests/multiVersion/**/*.js
    - src/mongo/db/modules/*/jstests/hot_backups_multiversion/*.js
    - src/mongo/db/modules/*/jstests/live_import_multiversion/*.js
    - src/mongo/db/modules/*/jstests/audit/multiVersion/*.js
  exclude_files:
    # Do not execute files with helper functions.
    - jstests/multiVersion/libs/*.js

    # TODO: SERVER-28104
    - jstests/multiVersion/genericBinVersion/minor_version_tags_new_old_new.js

    # TODO SERVER-42919: recent work on the ReplicaSetMonitor means that mongoS no longer crashes when
    # it attempts to connect to an upgraded mongoD. Un-denylist when SERVER-42919 fixes this issue.
    - jstests/multiVersion/genericSetFCVUsage/fcv_core/crash_mongos_against_upgraded_cluster.js

    # SERVER-80249 covers the 7.0-to-8.0 mixed cluster-role upgrade. On this branch last-lts
    # resolves to 8.0 and an omitted binVersion to latest (8.3). The test restarts its only
    # electable primary as shardsvr with the helper's 24-hour election timeout, then times out
    # waiting for a primary. Exclude until the scenario and election setup are adapted to 8.3.
    - jstests/multiVersion/genericBinVersion/mixed_cluster_roles.js
  exclude_with_any_tags:
    - featureFlagToaster
    - featureFlagSpoon
    # This suite's fixture does not set up authentication. There is a multiversion_auth variant
    # which does. Those tests which require auth should not run here, only in the auth variant.
    - requires_auth

# Multiversion tests start their own mongod's.
executor:
  archive:
    tests:
      - src/mongo/db/modules/enterprise/jstests/hot_backups_multiversion/*.js
      - src/mongo/db/modules/enterprise/jstests/live_imports_multiversion/*.js
  config:
    shell_options:
      nodb: ""
      global_vars:
        TestData:
          setParameters:
            bsonTestValidationVersion: 1
          # TODO (SERVER-111403): Enable OpenTelemetry tracing in multiversion suites.
          enableOTELTracing: false
