name: "Common setup"
description: "Shared setup steps for the workflows"

runs:
  using: "composite"
  steps:
    - name: Install deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt install -y gcc g++ cmake curl libssl-dev libldap2-dev libkrb5-dev \
                            libcurl4-openssl-dev libsasl2-dev liblz4-dev libbz2-dev \
                            libsnappy-dev zlib1g-dev libzlcore-dev liblzma-dev e2fslibs-dev

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: setup-python
      with:
        python-version: "3.13"
        cache: "pip"
        cache-dependency-path: uv.lock

    - name: Configure Python
      shell: bash
      run: |
        python -m pip install -U pip "uv==$(cat buildscripts/uv_version.txt)"

    - name: Python virtualenv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: venv
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock') }}

    - name: Install Python deps
      shell: bash
      if: steps.venv.outputs.cache-hit != 'true'
      run: |
        uv sync --locked --all-groups --no-group export --no-install-project \
          --python "${{ steps.setup-python.outputs.python-path }}"

    - name: Install Bazel
      shell: bash
      run: |
        uv run --no-sync python buildscripts/install_bazel.py
